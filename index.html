<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamonix Events 🏔️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        alpine: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe',
                            300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6',
                            600: '#1d4ed8', 700: '#1e3a5f', 800: '#15294a', 900: '#0d1b36',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #f8fafc; }
        .category-pill { @apply px-2 py-0.5 rounded-full text-xs font-medium; }
        .cat-concert { background: #dbeafe; color: #1e40af; }
        .cat-theatre { background: #f3e8ff; color: #6b21a8; }
        .cat-sport { background: #dcfce7; color: #166534; }
        .cat-market { background: #fef3c7; color: #92400e; }
        .cat-exhibition { background: #e0e7ff; color: #3730a3; }
        .cat-nightlife { background: #fce7f3; color: #9d174d; }
        .cat-family { background: #ccfbf1; color: #115e59; }
        .cat-cinema { background: #fce7f3; color: #9d174d; }
        .cat-other { background: #f1f5f9; color: #475569; }
        .event-card { transition: all 0.2s; }
        .event-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px -5px rgba(0,0,0,0.1); }
        .today-tag { background: #fee2e2; color: #991b1b; font-size: 0.65rem; padding: 1px 6px; border-radius: 999px; font-weight: 600; margin-left: 6px; }
        @keyframes countUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 640px) {
            .filter-row { flex-direction: column; gap: 0.5rem; }
        }
        .day-num { font-size: 2rem; line-height: 1; font-weight: 700; }
        .day-month { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-alpine-900 text-white py-8 px-4 shadow-lg">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-3xl md:text-4xl font-bold">Chamonix Events <span class="inline-block">🏔️</span></h1>
                <p class="text-alpine-200 mt-1 text-sm md:text-base">Rolling events calendar — what's on in the valley</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto px-4 py-6">
            <!-- Filters -->
            <div class="bg-white rounded-xl shadow-sm p-4 mb-6 border border-gray-100">
                <div class="filter-row flex gap-3 items-end">
                    <div class="flex-1 min-w-0">
                        <label class="text-xs font-medium text-gray-500 block mb-1">From</label>
                        <input type="date" id="filter-start" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-alpine-400 focus:border-transparent">
                    </div>
                    <div class="flex-1 min-w-0">
                        <label class="text-xs font-medium text-gray-500 block mb-1">To</label>
                        <input type="date" id="filter-end" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-alpine-400 focus:border-transparent">
                    </div>
                    <div class="flex-1 min-w-0">
                        <label class="text-xs font-medium text-gray-500 block mb-1">Category</label>
                        <select id="filter-category" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-alpine-400">
                            <option value="">All</option>
                            <option value="concert">Concert</option>
                            <option value="theatre">Theatre</option>
                            <option value="sport">Sport</option>
                            <option value="market">Market</option>
                            <option value="exhibition">Exhibition</option>
                            <option value="nightlife">Nightlife</option>
                            <option value="family">Family</option>
                            <option value="Cinema">Cinema</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="flex-1 min-w-0">
                        <label class="text-xs font-medium text-gray-500 block mb-1">Commune</label>
                        <select id="filter-commune" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-alpine-400">
                            <option value="">All communes</option>
                        </select>
                    </div>
                    <button id="search-btn" class="bg-alpine-600 hover:bg-alpine-700 text-white px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition shadow-sm">Search</button>
                    <button id="reset-filters" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-sm whitespace-nowrap transition">Reset</button>
                </div>
                <div class="mt-2 text-sm text-gray-500">
                    <span id="event-count">0</span> events found
                </div>
            </div>

            <!-- Events List -->
            <div id="events-list" class="space-y-3">
                <div id="loading-spinner" class="text-center py-16"><div class="inline-block w-8 h-8 border-4 border-alpine-200 border-t-alpine-600 rounded-full animate-spin"></div><p class="text-sm text-gray-400 mt-3">Loading events...</p></div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="border-t border-gray-200 py-6 px-4 mt-8 text-center text-xs text-gray-400">
            <p>Data sourced from <a href="https://www.chamonix.net/english/events" class="underline hover:text-alpine-600">chamonix.net</a>, <a href="https://www.allocine.fr/seance/salle_gen_csalle=P1406.html" class="underline hover:text-alpine-600">AlloCiné</a></p>
        </footer>
    </div>

    <script>
        let allEvents = [];
        const today = new Date();
        const in30 = new Date(today);
        in30.setDate(in30.getDate() + 30);

        function fmt(d) { return d.toISOString().split('T')[0]; }
        function fmtDMY(d) {
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            return dd + '/' + mm + '/' + yyyy;
        }
        document.getElementById('filter-start').value = fmt(today);
        document.getElementById('filter-end').value = fmt(in30);

        const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        function formatDate(isoStr) {
            if (!isoStr) return null;
            try {
                const d = new Date(isoStr);
                if (isNaN(d.getTime())) return null;
                const dd = String(d.getDate()).padStart(2, '0');
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const yyyy = d.getFullYear();
                return { date: d, day: DAYS[d.getDay()], dayNum: d.getDate(), month: MONTHS[d.getMonth()], year: yyyy, iso: fmt(d), display: dd + '/' + mm + '/' + yyyy };
            } catch { return null; }
        }

        function isToday(d) { return fmt(d) === fmt(today); }
        function isTomorrow(d) {
            const tom = new Date(today);
            tom.setDate(tom.getDate() + 1);
            return fmt(d) === fmt(tom);
        }

        function catClass(cat) {
            const map = { concert:'cat-concert', theatre:'cat-theatre', sport:'cat-sport', market:'cat-market', exhibition:'cat-exhibition', nightlife:'cat-nightlife', family:'cat-family', Cinema:'cat-cinema' };
            return map[cat] || 'cat-other';
        }

        function render() {
            const startVal = document.getElementById('filter-start').value;
            const endVal = document.getElementById('filter-end').value;
            const cat = document.getElementById('filter-category').value;
            const com = document.getElementById('filter-commune').value;

            let filtered = allEvents.filter(e => {
                const sd = formatDate(e.start_date);
                const ed = formatDate(e.end_date);
                if (!sd) return false;
                const eventStart = sd.iso;
                const eventEnd = ed ? ed.iso : eventStart;
                if (startVal && eventEnd < startVal) return false;
                if (endVal && eventStart > endVal) return false;
                if (cat && e.category !== cat) return false;
                if (com && e.commune !== com) return false;
                return true;
            });

            filtered.sort((a,b) => (a.start_date||'').localeCompare(b.start_date||''));

            animateCount(filtered.length);

            const container = document.getElementById('events-list');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-20"><div class="text-6xl mb-4">🔍</div><p class="text-gray-500 text-lg font-medium">No events match your filters</p><p class="text-gray-400 text-sm mt-2 max-w-sm mx-auto">Try expanding the date range, picking a different category, or clearing all filters to see everything happening in the valley.</p><button onclick="document.getElementById(\'reset-filters\').click()" class="mt-4 bg-alpine-600 hover:bg-alpine-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow-sm">Clear filters</button></div>';
                return;
            }

            container.innerHTML = filtered.map(e => {
                const fd = formatDate(e.start_date);
                const desc = e.description ? e.description.replace(/<[^>]*>/g,'').substring(0,150) : '';
                const todayLabel = fd && isToday(fd.date) ? '<span class=\"today-tag\">Today</span>' : (fd && isTomorrow(fd.date) ? '<span class=\"today-tag\">Tomorrow</span>' : '');
                const dateLabel = e.end_date && e.end_date !== e.start_date
                    ? (fd ? fd.display : '') + ' → ' + (formatDate(e.end_date)?.display || '')
                    : (fd ? fd.display : '');
                const imgHtml = e.image_url && !e.image_url.startsWith('data:') ? '<img src="' + e.image_url + '" alt="' + e.title + '" class="w-full h-40 object-cover rounded-t-xl" onerror="this.onerror=null;this.parentNode.innerHTML=\'<div class=\\\'w-full h-40 bg-gradient-to-br from-alpine-100 to-alpine-200 flex items-center justify-center text-4xl rounded-t-xl\\\'><span>🎬<\\/span><\\/div>\'">' : '<div class="w-full h-40 bg-gradient-to-br from-alpine-100 to-alpine-200 flex items-center justify-center text-4xl rounded-t-xl"><span>🎬</span></div>';
                const venueHtml = e.venue ? '<span class="text-xs text-gray-400">📍 ' + e.venue.substring(0, 40) + '</span>' : '';
                const addressHtml = e.address ? '<span class="text-xs text-gray-400">🏠 ' + e.address.substring(0, 40) + '</span>' : '';
                return '<div class="event-card bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden cursor-pointer" onclick="window.open(\'' + (e.source_url||'') + '\',\'_blank\')" >' +
                    imgHtml +
                    '<div class="p-4 flex gap-4">' +
                        '<div class="flex-shrink-0 w-16 text-center">' +
                            '<div class="day-num text-alpine-800">' + (fd ? fd.dayNum : '?') + '</div>' +
                            '<div class="text-xs text-gray-400 mt-0.5">' + (fd ? fd.display : '') + '</div>' +
                        '</div>' +
                        '<div class="flex-1 min-w-0">' +
                            '<div class="flex items-center gap-2 flex-wrap">' +
                                '<h3 class="font-semibold text-gray-900 text-base leading-tight">' + e.title + '</h3>' +
                                todayLabel +
                            '</div>' +
                            '<div class="flex items-center gap-2 mt-1 flex-wrap">' +
                                '<span class="category-pill ' + catClass(e.category) + '">' + e.category + '</span>' +
                                (e.commune ? '<span class="text-xs text-gray-400">📍 ' + e.commune + '</span>' : '') +
                                (dateLabel ? '<span class="text-xs text-gray-400">📅 ' + dateLabel + '</span>' : '') +
                                (e.time ? '<span class="text-xs text-gray-400">🕐 ' + e.time + '</span>' : '') +
                            '</div>' +
                            (venueHtml || addressHtml ? '<div class="flex items-center gap-2 mt-1 flex-wrap">' + venueHtml + addressHtml + '</div>' : '') +
                            (desc ? '<p class="text-sm text-gray-500 mt-2 line-clamp-2">' + desc + '</p>' : '') +
                            (e.showtimes ? '<details class="mt-2"><summary class="text-xs text-alpine-600 cursor-pointer hover:underline">Showtimes</summary><div class="mt-1 text-xs text-gray-500 space-y-0.5">' + Object.entries(e.showtimes).map(s => '<div><span class="font-medium">' + s[0] + '</span>: ' + s[1].join(', ') + '</div>').join('') + '</div></details>' : '') +
                            '<div class="text-xs text-alpine-600 mt-2 hover:underline">View details →</div>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function applyFilters() {
            const startVal = document.getElementById('filter-start').value;
            const endVal = document.getElementById('filter-end').value;
            if (startVal && !endVal) {
                const d = new Date(startVal);
                d.setDate(d.getDate() + 30);
                document.getElementById('filter-end').value = fmt(d);
            }
            render();
        }

        function populateCommunes(data) {
            const sel = document.getElementById('filter-commune');
            const communes = [...new Set(data.map(e => e.commune).filter(Boolean))].sort();
            communes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                sel.appendChild(opt);
            });
        }

        function animateCount(newCount) {
            const el = document.getElementById('event-count');
            const old = parseInt(el.textContent) || 0;
            el.textContent = newCount;
            el.style.animation = 'none';
            requestAnimationFrame(() => {
                el.style.animation = 'countUp 0.3s ease-out';
            });
        }

        fetch('data/events.json')
            .then(r => r.json())
            .then(data => {
                allEvents = data;
                populateCommunes(data);
                document.getElementById('loading-spinner').style.display = 'none';
                render();
            })
            .catch(() => {
                document.getElementById('loading-spinner').style.display = 'none';
                document.getElementById('events-list').innerHTML = '<div class=\"text-center py-16 text-gray-400\"><p>Could not load events</p><p class=\"text-sm mt-1\">Make sure events.json exists in the data/ folder</p></div>';
            });

        ['filter-start','filter-end','filter-category','filter-commune'].forEach(id => {
            document.getElementById(id).addEventListener('change', render);
        });
        document.getElementById('search-btn').addEventListener('click', applyFilters);
        document.getElementById('reset-filters').addEventListener('click', () => {
            document.getElementById('filter-start').value = fmt(today);
            document.getElementById('filter-end').value = fmt(in30);
            document.getElementById('filter-category').value = '';
            document.getElementById('filter-commune').value = '';
            render();
        });</script>
</body>
</html>
