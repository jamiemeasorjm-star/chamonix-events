# Chamonix Events — source registry
#
# Phase 2 / T13. This is the single source of truth for which data sources
# are active, what tier they belong to, and how often the pipeline should
# refresh them. The schema mirrors docs/schema.md (Source dataclass) and
# is consumed by scripts/sources.py + every scraper at startup.
#
# Trust levels (per plan §8.1 / §8.2):
#   high    → confidence baseline 1.0   (chamonix.net, chamonix.com, vox_pdf)
#   medium  → confidence baseline 0.8   (allocine_vox)
#   low     → confidence baseline 0.55  (nightlife, manual_submission)
#
# Ingestion cadence is an interval in hours; null means "on-demand only"
# (used by manual_submission).

# T26/legacy: previous global publish threshold. RETIRED in T55 — the review
# stage was removed, so this value is no longer used by upsert_events().
min_publish_confidence: 0.6

# T55: AUTO-PUBLISH RULES — silent quality guards (the review queue is gone).
# Events are DROPPED (not queued anywhere) only if they fall below the
# confidence floor or match an exclude pattern; near-identical duplicates are
# collapsed. Tune this as you review the site — it is THE knob for
# "what gets on".
publish_rules:
  min_confidence: 0.0          # absolute floor — drop only truly-broken events
  dedupe: true                 # collapse same [title + start_date + venue]
  exclude_title_patterns: []   # regex (case-insensitive); e.g. '^Cocktails & Social$'

sources:
  - id: chamonix_net
    name: Chamonix.net (EN)
    type: official
    base_url: https://www.chamonix.net/english/events
    trust_level: high
    ingestion_cadence_hours: 6
    active: true

  - id: chamonix_com
    name: Chamonix.com (FR)
    type: official
    base_url: https://www.chamonix.com/evenements/evenements-et-manifestations
    trust_level: high
    ingestion_cadence_hours: 24
    min_publish_confidence: 0.2
    active: true

  - id: vox_pdf
    name: Le Vox cinema PDF
    type: official
    base_url: https://cinemavox-chamonix.com/fichier/programme.pdf
    trust_level: high
    ingestion_cadence_hours: 168
    active: true

  - id: allocine_vox
    name: AlloCiné Le Vox
    type: aggregator
    base_url: https://www.allocine.fr/seance/salle_gen_csalle=P1406.html
    trust_level: medium
    ingestion_cadence_hours: 24
    active: true
    notes: "T02+T12 complete — enriched detail data for cinema films."

  - id: chamonix_nightlife
    name: Nightlife venues
    type: venue
    base_url: null
    trust_level: low
    ingestion_cadence_hours: 168
    min_publish_confidence: 0.3
    active: true
    notes: "T30 — scraped venues + curated recurring. Image_url required in expected fields; events without images compute ~0.21 confidence and route to review queue."

  - id: manual_submission
    name: User submissions
    type: community
    base_url: null
    trust_level: low
    ingestion_cadence_hours: null
    active: true
    notes: "Phase 4 / T32 — always review (confidence capped at 0.55)."