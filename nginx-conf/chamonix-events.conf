# Chamonix Events — nginx reverse proxy (T06 / Phase 1)
#
# Fronts the supervised static server (port 8090 inside the container) on
# port 8095, exposing it through nginx with proper cache-control headers
# for /data/*.json and a passthrough for /healthz.
#
# This file is managed by the entrypoint.sh: at container start the file is
# copied from /opt/data/nginx-conf/chamonix-events.conf (bind-mounted) into
# /etc/nginx/conf.d/ and nginx is reloaded. Editing this file on the host
# is enough — no need to rebuild the container.
#
# External HTTPS / Traefik routing is a Phase 4 task (T38).

# Internal server (port 8095) — used by host-nginx default.conf's /events/ proxy.
# WARNING: host-nginx default.conf strips the /events/ prefix via trailing slash
# on proxy_pass. We add it back here for event detail pages.
server {
    listen 8095;
    listen [::]:8095;
    server_name _;

    # Reasonable defaults
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;

    # Gzip text/JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Access + error logs go to /var/log/nginx inside the container
    access_log /var/log/nginx/chamonix-events-access.log;
    error_log  /var/log/nginx/chamonix-events-error.log warn;

    # /healthz: passthrough with no access log noise
    location = /healthz {
        proxy_pass http://127.0.0.1:8090/healthz;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 5s;
        access_log off;
    }

    # JSON data files get a short cache so external clients can refresh
    # without flooding the scraper. (audit §1.3 + §11.6)
    location /data/ {
        proxy_pass http://127.0.0.1:8090/data/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Source "chamonix-events-nginx" always;
    }

    # Everything else: serve the static site
    location / {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # index.html must NOT be aggressively cached so a build update is
        # picked up promptly. Cache for 60s + must-revalidate is enough.
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
    }
}

